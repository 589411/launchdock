<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="438" rx="12" fill="#f8fafc" stroke="#d0d7de" stroke-width="2"/>
  <text x="28" y="40" font-size="20" font-weight="bold" fill="#0f3460">整理 20 份報價單：三種句型</text>

  <rect x="40" y="90" width="200" height="70" rx="10" fill="#eef4ff" stroke="#1f6feb"/>
  <text x="56" y="118" font-size="13" fill="#1f6feb">流程（先…再…）</text>
  <text x="56" y="142" font-size="14" fill="#24292f">讀檔 → 抓出欄位</text>

  <line x1="244" y1="125" x2="296" y2="125" stroke="#0f3460" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="300" y="90" width="200" height="70" rx="10" fill="#fff8e6" stroke="#b7791f"/>
  <text x="316" y="118" font-size="13" fill="#b7791f">條件（如果…就…）</text>
  <text x="316" y="142" font-size="14" fill="#24292f">缺金額？標「待確認」</text>

  <line x1="504" y1="125" x2="556" y2="125" stroke="#0f3460" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="560" y="90" width="200" height="70" rx="10" fill="#f1f8f4" stroke="#2e7d32"/>
  <text x="576" y="118" font-size="13" fill="#2e7d32">寫進同一張表</text>
  <text x="576" y="142" font-size="14" fill="#24292f">一份一列</text>

  <path d="M 660 164 L 660 220 L 140 220 L 140 168" fill="none" stroke="#1976d2" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <rect x="250" y="205" width="300" height="30" rx="6" fill="#f8fafc"/>
  <text x="400" y="226" font-size="14" font-weight="bold" fill="#1976d2" text-anchor="middle">迴圈：每一份都做，做完 20 份才停</text>

  <rect x="40" y="280" width="720" height="110" rx="10" fill="#ffffff" stroke="#8b949e"/>
  <text x="60" y="310" font-size="13" fill="#8b949e">對照生活</text>
  <text x="60" y="336" font-size="14" fill="#24292f">流程＝食譜的步驟；條件＝「沒有雞蛋就改用豆腐」；</text>
  <text x="60" y="362" font-size="14" fill="#24292f">迴圈＝「每個盤子都擺上同樣的配菜」</text>

  <text x="28" y="422" font-size="12" fill="#8b949e">launchdock.app</text>
