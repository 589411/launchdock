<svg viewBox="0 0 820 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1976d2"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="818" height="498" rx="12" fill="#f8fafc" stroke="#d0d7de" stroke-width="2"/>
  <text x="32" y="38" font-size="21" font-weight="bold" fill="#0f3460">同一個任務：把 200 張收據整理成報帳表</text>

  <!-- Harness outer frame -->
  <rect x="24" y="56" width="772" height="418" rx="14" fill="#faf5ff" stroke="#7e3ff2" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="44" y="82" font-size="14" font-weight="bold" fill="#7e3ff2">Harness（管事的那層）＝設邊界／驗成果／錯了怎麼辦／什麼時候停</text>

  <!-- Prompt -->
  <rect x="48" y="98" width="204" height="112" rx="9" fill="#e3f0fb" stroke="#1976d2"/>
  <text x="150" y="126" font-size="16" font-weight="bold" fill="#1976d2" text-anchor="middle">Prompt 工程</text>
  <text x="150" y="148" font-size="12" fill="#8b949e" text-anchor="middle">你交代它什麼</text>
  <text x="150" y="172" font-size="12.5" fill="#24292f" text-anchor="middle">「每張抓日期、品項、</text>
  <text x="150" y="192" font-size="12.5" fill="#24292f" text-anchor="middle">金額，輸出成 CSV」</text>

  <!-- Context -->
  <rect x="48" y="238" width="204" height="146" rx="9" fill="#fff7e6" stroke="#e0a300"/>
  <text x="150" y="266" font-size="16" font-weight="bold" fill="#a97400" text-anchor="middle">Context 工程</text>
  <text x="150" y="288" font-size="12" fill="#8b949e" text-anchor="middle">它手上有哪些料</text>
  <text x="150" y="312" font-size="12.5" fill="#24292f" text-anchor="middle">200 張塞不進一次對話</text>
  <text x="150" y="334" font-size="12.5" fill="#24292f" text-anchor="middle">→ 分批餵、每批留摘要</text>
  <text x="150" y="356" font-size="12.5" fill="#24292f" text-anchor="middle">→ 只給這批用得到的</text>

  <path d="M 256 154 L 296 186" stroke="#1976d2" stroke-width="2" fill="none" marker-end="url(#arb)"/>
  <path d="M 256 310 L 296 288" stroke="#e0a300" stroke-width="2" fill="none" marker-end="url(#arb)"/>

  <!-- Loop -->
  <rect x="300" y="98" width="318" height="286" rx="9" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="459" y="126" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="middle">Loop（迴圈）</text>
  <text x="459" y="146" font-size="12" fill="#8b949e" text-anchor="middle">一次只做一張，做 200 遍</text>

  <rect x="320" y="162" width="132" height="60" rx="7" fill="#ffffff" stroke="#2e7d32"/>
  <text x="386" y="186" font-size="12.5" font-weight="bold" fill="#24292f" text-anchor="middle">① 讀一張收據</text>
  <text x="386" y="206" font-size="11.5" fill="#8b949e" text-anchor="middle">看清楚上面寫什麼</text>

  <rect x="466" y="162" width="132" height="60" rx="7" fill="#ffffff" stroke="#2e7d32"/>
  <text x="532" y="186" font-size="12.5" font-weight="bold" fill="#24292f" text-anchor="middle">② 填進表格一列</text>
  <text x="532" y="206" font-size="11.5" fill="#8b949e" text-anchor="middle">日期／品項／金額</text>

  <rect x="466" y="262" width="132" height="60" rx="7" fill="#ffffff" stroke="#2e7d32"/>
  <text x="532" y="286" font-size="12.5" font-weight="bold" fill="#24292f" text-anchor="middle">③ 對一下金額</text>
  <text x="532" y="306" font-size="11.5" fill="#8b949e" text-anchor="middle">跟收據上一樣嗎</text>

  <rect x="320" y="262" width="132" height="60" rx="7" fill="#ffffff" stroke="#2e7d32"/>
  <text x="386" y="286" font-size="12.5" font-weight="bold" fill="#24292f" text-anchor="middle">④ 換下一張</text>
  <text x="386" y="306" font-size="11.5" fill="#8b949e" text-anchor="middle">前一張就放掉</text>

  <path d="M 452 192 L 462 192" stroke="#2e7d32" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 532 226 L 532 258" stroke="#2e7d32" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 466 292 L 456 292" stroke="#2e7d32" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 386 258 L 386 226" stroke="#2e7d32" stroke-width="2" marker-end="url(#ar)"/>

  <text x="459" y="350" font-size="12" fill="#2e7d32" text-anchor="middle">每一圈只扛一張的份量，所以第 187 張時它還沒累垮</text>
  <text x="459" y="370" font-size="12" fill="#8b949e" text-anchor="middle">（這就是 Loop 和「一口氣講完」的差別）</text>

  <!-- output -->
  <path d="M 622 240 L 656 240" stroke="#2e7d32" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="660" y="186" width="112" height="108" rx="9" fill="#ffffff" stroke="#0f3460"/>
  <text x="716" y="216" font-size="13" font-weight="bold" fill="#0f3460" text-anchor="middle">報帳表</text>
  <text x="716" y="240" font-size="11.5" fill="#8b949e" text-anchor="middle">200 列</text>
  <text x="716" y="262" font-size="11.5" fill="#8b949e" text-anchor="middle">每一列</text>
  <text x="716" y="280" font-size="11.5" fill="#8b949e" text-anchor="middle">都有據可查</text>

  <!-- harness bar -->
  <rect x="48" y="402" width="724" height="54" rx="9" fill="#f3e8fd" stroke="#7e3ff2"/>
  <text x="66" y="426" font-size="12.5" font-weight="bold" fill="#7e3ff2">Harness 在整趟裡做的四件事（模型自己不會做）：</text>
  <text x="66" y="446" font-size="12.5" fill="#24292f">⛔ 不准自己編金額　　🔁 讀不出來就重試一次　　✋ 對不上就停下來問人　　⏱ 做完 200 張就收工</text>
</svg>
